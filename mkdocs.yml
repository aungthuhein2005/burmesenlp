site_name: BurmeseNLP
site_description: Rule-based Myanmar (Burmese) NLP preprocessing toolkit
site_url: https://aungthuhein2005.github.io/burmesenlp/
repo_url: https://github.com/aungthuhein2005/burmesenlp
repo_name: aungthuhein2005/burmesenlp
edit_uri: edit/main/docs/
copyright: Copyright &copy; BurmeseNLP contributors

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/css/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aungthuhein2005/burmesenlp

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - User guide:
      - user-guide/index.md
      - Pipeline & Document: user-guide/pipeline.md
      - Normalization & Zawgyi: user-guide/normalize.md
      - Syllables & words: user-guide/words.md
      - Multi-word expressions: user-guide/mwe.md
      - POS tagging: user-guide/pos.md
      - Phrase chunking: user-guide/chunking.md
      - Sentence segmentation: user-guide/sentences.md
      - Lexicon: user-guide/lexicon.md
      - CLI: user-guide/cli.md
  - Algorithms:
      - algorithms/index.md
      - Pipeline order: algorithms/pipeline.md
      - Longest-match words: algorithms/word-segmentation.md
      - BMWE trie: algorithms/bmwe.md
      - Rule POS: algorithms/pos.md
      - Grammar sentences: algorithms/sentences.md
  - Tutorials:
      - tutorials/index.md
      - Process a document: tutorials/process-document.md
      - Custom lexicon: tutorials/custom-lexicon.md
  - API reference:
      - api/index.md
      - burmesenlp: api/burmesenlp.md
      - Pipeline: api/pipeline.md
      - Tokenize: api/tokenize.md
      - Tag: api/tag.md
      - Chunking: api/chunking.md
      - MWE: api/mwe.md
      - Lexicon: api/lexicon.md
      - Normalize & Zawgyi: api/normalize.md
  - Developer guide:
      - developer-guide/index.md
      - Contributing: developer-guide/contributing.md
      - Building docs: developer-guide/docs.md
  - Research:
      - research/index.md
      - Roadmap: research/roadmap.md
