[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "burmesenlp"
version = "1.0.0"
description = "Production-oriented Myanmar (Burmese) NLP preprocessing: syllable, word and sentence segmentation plus rule-based POS tagging."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "BurmeseNLP Toolkit" }]
keywords = ["myanmar", "burmese", "nlp", "segmentation", "pos-tagging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: Burmese",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

[project.scripts]
burmesenlp = "burmesenlp.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
burmesenlp = [
    "py.typed",
    "zawgyi/*.json",
    "corpus/**/*.txt",
    "corpus/**/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
