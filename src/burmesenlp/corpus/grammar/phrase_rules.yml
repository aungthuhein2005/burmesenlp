# Main phrase-chunking grammar (linguist-editable).
# Quote atoms that contain ?, *, or | so YAML flow lists stay valid.
# PROPN aliases to NOUN at match time.
#
# Clause typing (MAIN / CONDITIONAL / REASON / …) lives in clause_rules.yml
# and is applied by ClauseParser — not by these phrase patterns.

version: 1

phrases:

  # =========================
  # BMWE idioms (fixed expressions)
  # =========================
  - name: FIXED_EXPRESSION
    type: FIXED_EXPRESSION
    priority: 250
    patterns:
      - ["IDIOM"]

  # =========================
  # Verb Phrase (VP) — high priority
  # =========================
  - name: VERB_PHRASE
    type: VP
    priority: 200
    patterns:
      # Negation / particle shells around the verb (မ … ဘူး, … ပြီး ပြီ, …)
      - ["PART", "VERB", "AUX*", "PART*", "SFP?"]
      - ["ADV?", "VERB", "AUX+", "PART*", "SFP?"]
      - ["VERB", "AUX", "PART", "SFP"]
      - ["VERB", "AUX", "SFP"]
      - ["VERB", "AUX"]
      - ["VERB", "AUX+", "SFP?"]
      - ["VERB", "PART+", "SFP?"]
      - ["VERB", "AUX", "PART*"]
      - ["PART", "VERB", "PART+", "SFP?"]
      - ["PART", "VERB", "SFP"]
      - ["VERB", "SFP"]
      - ["VERB"]

  # =========================
  # Postpositional Phrase (PP)
  # =========================
  - name: POSTPOSITIONAL_PHRASE
    type: PP
    priority: 150
    patterns:
      - ["NOUN_PHRASE", "POSTP"]
      # Plural / topic shell before case/topic marker (အကဲခတ် တွေ ကတော့)
      - ["(PROPN|NOUN|PRON)+", "PART*", "POSTP"]
      - ["(PROPN|NOUN|PRON)+", "POSTP"]
      - ["NOUN", "POSTP"]

  # =========================
  # Noun Phrase (NP)
  # =========================
  - name: NOUN_PHRASE
    type: NP
    priority: 100
    patterns:
      # POSTP-ending shapes belong to PP (priority 150) — do not duplicate here.
      - ["PRON", "PART", "SFP?"]
      - ["PRON", "PART"]
      - ["ADJ", "NOUN"]
      - ["NUM", "NOUN"]
      - ["NOUN", "NOUN+"]
      - ["(PROPN|NOUN|PRON)+", "PART"]
      - ["(PROPN|NOUN|PRON)+"]
      - ["NOUN"]
      - ["PRON"]

  # =========================
  # Adjective Phrase
  # =========================
  - name: ADJECTIVE_PHRASE
    type: ADJP
    priority: 80
    patterns:
      - ["ADV", "ADJ"]
      - ["ADJ"]

  # =========================
  # Numeral Phrase
  # =========================
  - name: NUMERAL_PHRASE
    type: NUMP
    priority: 70
    patterns:
      - ["NUM", "NOUN"]
      - ["NUM"]
