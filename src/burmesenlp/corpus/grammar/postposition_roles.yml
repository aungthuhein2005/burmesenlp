    possible_roles: [POSSESSOR]
  ရဲ့:
    default_role: POSSESSOR
    grammatical_function: POSSESSOR
    possible_roles: [POSSESSOR]
  ထက်:
    default_role: STANDARD
    grammatical_function: ADJUNCT
    possible_roles: [STANDARD, COMPARISON]
  ဖြင့်:
    default_role: INSTRUMENT
    grammatical_function: ADJUNCT
    possible_roles: [INSTRUMENT, MANNER]
  နှင့်:
    default_role: COMITATIVE
    grammatical_function: ADJUNCT
    possible_roles: [COMITATIVE, COORDINATION]
