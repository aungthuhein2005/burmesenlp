# Special cases that generic patterns cannot handle cleanly.

version: 1

exceptions:

  fixed_expressions:
    - text: မင်္ဂလာပါ
      type: GREETING
    - text: ကျေးဇူးတင်ပါတယ်
      type: FIXED_EXPRESSION

  never_split:
    - မန္တလေး
    - ရန်ကုန်
    - မြန်မာဘာသာစကား
    - သလို
    - ကတော့
    - ဆိုတဲ့
    - ပေမဲ့
    - သောကြောင့်

  special_phrases:
    - text: မင်္ဂလာပါ
      chunk: GREETING
    - text: အားနာပါတယ်
      chunk: FIXED_VERB
